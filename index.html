<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPRYT — Legion Samobójców</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090909;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* NAGŁÓWEK */
        .header {
            width: 100%;
            height: 70px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090909;
            border-bottom: 2px solid #222;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 8px;
            color: white;
            text-shadow:
                0 0 8px rgba(255,255,255,0.4),
                0 0 20px rgba(150,0,255,0.6);
        }

        /* OBSZAR GRY */
        .game-area {
            width: 100%;
            height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .game-frame {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            position: absolute;
            left: 0;
            top: -50px;
            width: 100%;
            height: calc(100% + 50px);
            border: none;
            display: block;
        }

        /* EKRAN STARTOWY */
        .start-screen {
            position: absolute;
            inset: 0;
            z-index: 15;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background:
              #000;

            text-align: center;
        }

        .start-title {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 12px;
            color: white;

            text-shadow:
                0 0 10px rgba(255,255,255,0.5),
                0 0 25px rgba(160,0,255,0.8),
                0 0 50px rgba(100,0,150,0.6);

            margin-bottom: 15px;
        }

        .start-subtitle {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #b66cff;
            margin-bottom: 25px;
        }

        .start-description {
            max-width: 600px;
            padding: 0 20px;

            font-size: 20px;
            line-height: 1.5;
            color: #eeeeee;

            margin-bottom: 40px;
        }

        .start-button {
            padding: 18px 45px;

            border: 2px solid #b66cff;
            border-radius: 12px;

            background: rgba(100, 0, 150, 0.25);
            color: white;

            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 0 15px rgba(170, 0, 255, 0.5),
                inset 0 0 15px rgba(170, 0, 255, 0.15);

            transition: 0.2s;
        }

        .start-button:hover {
            transform: scale(1.06);

            background: rgba(130, 0, 180, 0.65);

            box-shadow:
                0 0 25px rgba(190, 0, 255, 0.8),
                0 0 50px rgba(120, 0, 180, 0.4);
        }

        /* FULLSCREEN */
        .fullscreen-button {
            position: absolute;
            right: 18px;
            bottom: 18px;
            z-index: 20;

            width: 46px;
            height: 46px;

            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 10px;

            background: rgba(0,0,0,0.75);
            color: white;

            font-size: 24px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s;
        }

        .fullscreen-button:hover {
            background: rgba(90,0,120,0.85);
            transform: scale(1.05);
        }

        /* MAŁE EKRANY */
        @media (max-width: 600px) {

            .header {
                height: 55px;
                min-height: 55px;
            }

            .logo {
                font-size: 26px;
                letter-spacing: 5px;
            }

            .game-area {
                height: calc(100vh - 55px);
            }

            .start-title {
                font-size: 42px;
                letter-spacing: 7px;
            }

            .start-subtitle {
                font-size: 19px;
            }

            .start-description {
                font-size: 17px;
            }

            .start-button {
                font-size: 18px;
                padding: 15px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">SPRYT</div>
    </div>

    <div class="game-area" id="gameArea">

        <div class="game-frame">

            <iframe
                id="game"
                src="spryt.html"
                allowfullscreen>
            </iframe>

        </div>

        <!-- EKRAN STARTOWY -->
        <div class="start-screen" id="startScreen">

            <div class="start-title">
                SPRYT
            </div>

            <div class="start-subtitle">
                15 SEKUND
            </div>

            <div class="start-description">
                Klikaj w Jokera i zdobądź jak najwięcej punktów,
                zanim skończy się czas!
            </div>

            <button
                class="start-button"
                onclick="startGame()">
                ▶ ROZPOCZNIJ GRĘ
            </button>

        </div>

        <!-- PEŁNY EKRAN -->
        <button
            class="fullscreen-button"
            onclick="toggleFullscreen()"
            title="Pełny ekran">
            ⛶
        </button>

    </div>

    <script>

        function startGame() {

            const iframe = document.getElementById("game");
            const startScreen = document.getElementById("startScreen");

            startScreen.style.display = "none";

            iframe.src =
                "https://turbowarp.org/1378788515/embed?autoplay";
        }

        function toggleFullscreen() {

            const gameArea =
                document.getElementById("gameArea");

            if (!document.fullscreenElement) {

                gameArea.requestFullscreen();

            } else {

                document.exitFullscreen();

            }
        }
window.addEventListener("message", async (event) => {
    if (event.data?.type !== "spryt-score") return;

    const score = Number(event.data.score);
    const params = new URLSearchParams(window.location.search);
    const channelId = params.get("channel");

    if (!Number.isInteger(score) || !channelId) return;

    try {
        await fetch("https://spryt-bot.onrender.com/score", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                score: score,
                channelId: channelId
            })
        });
    } catch (error) {
        console.error("Nie udało się wysłać wyniku:", error);
    }
});
    </script>

</body>
</html>
