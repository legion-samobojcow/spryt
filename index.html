<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPRYT — Legion Samobójców</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090909;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Górny nagłówek */
        .header {
            width: 100%;
            height: 70px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090909;
            border-bottom: 2px solid #222;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow:
                0 0 8px rgba(255,255,255,0.4),
                0 0 20px rgba(150,0,255,0.6);
        }

        /* Miejsce na grę */
        .game-area {
            width: 100%;
            height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* Ukrywamy pasek sterowania TurboWarp */
        .game-frame {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            position: absolute;
            left: 0;
            top: -50px;
            width: 100%;
            height: calc(100% + 50px);
            border: none;
            display: block;
        }

        /* Nasz własny przycisk fullscreen */
        .fullscreen-button {
            position: absolute;
            right: 18px;
            bottom: 18px;
            z-index: 20;

            width: 46px;
            height: 46px;

            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 10px;

            background: rgba(0,0,0,0.75);
            color: white;

            font-size: 24px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s;
        }

        .fullscreen-button:hover {
            background: rgba(90,0,120,0.85);
            transform: scale(1.05);
        }

        /* Na małych ekranach */
        @media (max-width: 600px) {
            .header {
                height: 55px;
                min-height: 55px;
            }

            .logo {
                font-size: 26px;
                letter-spacing: 5px;
            }

            .game-area {
                height: calc(100vh - 55px);
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">SPRYT</div>
    </div>

    <div class="game-area" id="gameArea">

        <div class="game-frame" id="gameFrame">

            <iframe
                id="game"
                src="https://turbowarp.org/1378788515/embed?autoplay"
                allowfullscreen>
            </iframe>

        </div>

        <button
            class="fullscreen-button"
            onclick="toggleFullscreen()"
            title="Pełny ekran">
            ⛶
        </button>

    </div>

    <script>
        function toggleFullscreen() {
            const gameArea = document.getElementById("gameArea");

            if (!document.fullscreenElement) {
                gameArea.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
